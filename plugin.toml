id = "pir0c0pter0/frigate"
name = "Frigate Viewer"
version = "2.0.0"
plugin_api = 26
author = "pir0c0pter0"
license = "MIT"
icon = "device-cctv"
description = "Live Frigate camera snapshots in a native Noctalia panel."
tags = ["camera", "security"]
dependencies = ["bash", "secret-tool"]

[[service]]
id = "service"
entry = "Main.luau"

[[service]]
id = "doorbell"
entry = "Doorbell.luau"

[[widget]]
id = "bar"
entry = "BarWidget.luau"

[widget.actions]
left = "panel-toggle pir0c0pter0/frigate:viewer"

[[panel]]
id = "viewer"
entry = "Panel.luau"
width = 720
height = 540
placement = "attached"
position = "auto"
capture_keys = ["Left", "Right"]
